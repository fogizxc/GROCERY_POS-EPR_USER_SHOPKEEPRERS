name: Fix Vercel ESM runtime imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix runtime imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/routes/api.ts')
          s = p.read_text()
          replacements = {
              "from '../store/memoryStore'": "from '../store/memoryStore.ts'",
              "from '../models/catalog'": "from '../models/catalog.ts'",
              "from '../models/domain'": "from '../models/domain.ts'",
              "from '../auth/middleware'": "from '../auth/middleware.ts'",
              "from '../db/repositories'": "from '../db/repositories.ts'",
              "from '../db/mongodb'": "from '../db/mongodb.ts'",
              "req.header('Idempotency-Key')": "req.headers['idempotency-key']",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          shim = Path('server/store/memoryStore')
          if shim.exists():
              shim.unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routes/api.ts server/store/memoryStore
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: use explicit ESM extensions in API routes [skip ci]'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-vercel-esm.yml
          git add .github/workflows/fix-vercel-esm.yml
          git commit -m 'chore: remove temporary import fix workflow [skip ci]'
          git push
