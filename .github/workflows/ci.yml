name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: Build frontend and server
        run: npm run build
      - name: Build production container
        run: docker build --tag freshcart:${{ github.sha }} .
